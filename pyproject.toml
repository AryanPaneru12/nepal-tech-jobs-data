[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nepal-jobs-data"
version = "0.1.0"
description = "Evidence-first data pipeline for Nepal technology employers and remote jobs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Nepal Jobs Data contributors" }]
dependencies = [
  "boto3>=1.35,<2",
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "pyarrow>=23.0.1,<24",
  "pydantic>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "pytz>=2025.2",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "selectolax>=0.3.21,<1",
  "structlog>=24.4,<27",
  "typer>=0.12,<1",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
scraping = ["scrapy>=2.11,<3", "playwright>=1.47,<2"]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
njobs = "nepal_jobs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nepal_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
