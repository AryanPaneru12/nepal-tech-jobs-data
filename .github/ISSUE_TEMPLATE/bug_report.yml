name: Bug report
description: Report a reproducible pipeline, CLI, parser, or export problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach raw private responses, credentials, or recruiter personal data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the command and minimal sanitized input needed to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      render: shell
